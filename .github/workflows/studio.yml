name: Studio
# The studio page (site/studio) edits catalog.json. Every time it does, this makes the site match:
# new pieces, new cutouts, 3D models, rebuilt data. Then it publishes. It needs a Mac for Apple Vision.
on:
  push:
    branches: [main, studio-test]
    paths: [catalog.json]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: studio-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  make:
    name: Make the pieces
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}       # the newest catalog, even if this run waited behind another
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Get the tools ready
        run: |
          pip install -q -r tools/requirements.txt
          swiftc -O tools/vision.swift -o tools/vision
      - name: Make the pieces
        id: run
        run: python tools/studio/run.py
      - name: Save the result
        run: |
          git config user.name "True Offline Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog.json site
          git diff --cached --quiet && exit 0
          git commit -q -m "Studio: ${{ steps.run.outputs.summary }}"
          # If the catalog changed again while this ran, that push started its own run, which does it all from the newest state.
          git push origin HEAD:${{ github.ref_name }} || echo "::notice::Newer changes arrived while this ran. The next run picks them up."
  deploy:
    name: Publish the site
    needs: make
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

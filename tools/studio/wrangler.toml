# Cloudflare Worker that holds the studio's GitHub token. Deploy with: wrangler deploy
# (run from this folder: cd tools/studio). See the README for the one-time setup.
name = "true-offline-studio"
main = "worker.js"
compatibility_date = "2026-01-01"

# The site allowed to call the worker. Change this if the site ever moves.
[vars]
ALLOW_ORIGINS = "https://reidwcoleman.github.io"

# Secrets are NOT kept here. Set them once, after the first deploy:
#   wrangler secret put GH_TOKEN          <- paste the fine-grained token
#   wrangler secret put STUDIO_PASSWORD   <- optional; skip this for no password
